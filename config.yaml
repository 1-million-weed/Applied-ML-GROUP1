# ===============================
# Model Configuration
# ===============================
model:
  name: "MultiLayerRegression"        # Options: ["RandomForestClassifier", "XGBClassifier", "XGBRegressor", "MultiLayerPerceptron", "MultiLayerRegression"]

# ===============================
# Dataset Configuration
# ===============================
dataset: 
  calculate_elo: false
  generate: false
  test_size: 0.2
  random_state: 42
  empty_folder: true

# ===============================
# Training Configuration
# ===============================
training:
  enabled: true
  test_size: 0.2
  show_plot: true   #todo
  ground_truth: "finishing_position"
  training_features: ['normalized_lap', 'average_normalized_lap', 'lap_progress', 'current_position_norm', 'normalized_driver_standing', 'normalized_fastest_qualifying', 'position_quali', 'normalized_driver_elo' , 'amount_of_wins', 'points_team', 'year']
  tensorboard: true   #todo
  by_year: false #only for multi-layer regression 

# ===============================
# Evaluation Configuration
# ===============================

evaluation:
  enabled: true
  show_plot: true 

# ===============================
# Inference Configuration
# ===============================
inference:
  enabled: true
  api: true
  streamlit: true
